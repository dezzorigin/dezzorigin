<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="180" viewBox="0 0 900 180" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#151d30"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
    </filter>

    <!-- Dot Grid Pattern -->
    <pattern id="dot-grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Card Container -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="16"/>
  <rect width="100%" height="100%" fill="url(#dot-grid)" rx="16"/>

  <!-- Glowing Background Orbs -->
  <circle cx="450" cy="90" r="100" fill="#6366f1" fill-opacity="0.15" filter="url(#glow-purple)"/>

  <!-- Glass Border Overlay -->
  <rect x="1" y="1" width="898" height="178" rx="15" fill="none" stroke="url(#border-grad)" stroke-width="1.5"/>

  <!-- Main Title -->
  <text x="450" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="900" fill="url(#title-grad)" letter-spacing="-0.5">Keep Building.</text>

  <!-- Subtitle Tagline -->
  <text x="450" y="122" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#94a3b8" letter-spacing="0.5">Turning Ideas into Scalable Digital Products.</text>
</svg>
