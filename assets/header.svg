<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="220" viewBox="0 0 900 220" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#151d30"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
    </filter>

    <!-- Dot Grid Pattern -->
    <pattern id="dot-grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Card Container -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="16"/>
  <rect width="100%" height="100%" fill="url(#dot-grid)" rx="16"/>

  <!-- Glowing Background Orbs -->
  <circle cx="150" cy="60" r="80" fill="#06b6d4" fill-opacity="0.15" filter="url(#glow-purple)"/>
  <circle cx="750" cy="160" r="90" fill="#8b5cf6" fill-opacity="0.15" filter="url(#glow-purple)"/>

  <!-- Glass Border Overlay -->
  <rect x="1" y="1" width="898" height="218" rx="15" fill="none" stroke="url(#border-grad)" stroke-width="1.5"/>

  <!-- Top Tech Badge -->
  <g transform="translate(450, 45)">
    <rect x="-110" y="-14" width="220" height="26" rx="13" fill="#1e293b" fill-opacity="0.6" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <text text-anchor="middle" y="3" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="2">PRODUCT ENGINEER</text>
  </g>

  <!-- Main Name Title -->
  <text x="450" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="url(#title-grad)" letter-spacing="-0.5">Nabil Aulia Dika</text>

  <!-- Subtitle Tagline -->
  <text x="450" y="156" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#94a3b8" letter-spacing="0.5">Turning Ideas into Scalable Digital Products.</text>

  <!-- Accent Lines -->
  <line x1="330" y1="182" x2="420" y2="182" stroke="url(#title-grad)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6"/>
  <circle cx="450" cy="182" r="3" fill="#818cf8"/>
  <line x1="480" y1="182" x2="570" y2="182" stroke="url(#title-grad)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.6"/>
</svg>
