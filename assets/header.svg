<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="200" viewBox="0 0 900 200" fill="none">
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 42px; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 400; fill: #a1a1aa; letter-spacing: 0.2px; }
    .badge-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #ffffff; letter-spacing: 1.5px; }
  </style>

  <!-- Container -->
  <rect width="100%" height="100%" fill="#0a0a0a" rx="12"/>
  <rect x="1" y="1" width="898" height="198" rx="11" fill="none" stroke="#262626" stroke-width="1"/>

  <!-- Top Badge -->
  <g transform="translate(450, 42)">
    <rect x="-95" y="-13" width="190" height="26" rx="6" fill="#171717" stroke="#3f3f46" stroke-width="1"/>
    <text text-anchor="middle" y="4" class="badge-text">PRODUCT ENGINEER</text>
  </g>

  <!-- Main Title -->
  <text x="450" y="112" text-anchor="middle" class="title">Nabil Aulia Dika</text>

  <!-- Subtitle Tagline -->
  <text x="450" y="148" text-anchor="middle" class="subtitle">Turning Ideas into Scalable Digital Products.</text>

  <!-- Minimal Line Divider -->
  <line x1="410" y1="170" x2="490" y2="170" stroke="#3f3f46" stroke-width="1"/>
</svg>
