<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="220" viewBox="0 0 900 220" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#131b2e"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>

    <linearGradient id="card-border-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="card-border-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="card-border-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.2"/>
    </linearGradient>

    <pattern id="dot-grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="16"/>
  <rect width="100%" height="100%" fill="url(#dot-grid)" rx="16"/>

  <!-- Column 1: Product & Systems -->
  <g transform="translate(20, 20)">
    <rect width="273" height="180" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="url(#card-border-1)" stroke-width="1.5"/>
    <!-- Category Pill -->
    <rect x="16" y="16" width="135" height="22" rx="6" fill="#1e293b"/>
    <text x="83.5" y="31" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1">PRODUCT &amp; SYSTEMS</text>
    <!-- Title -->
    <text x="16" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#f8fafc">Regesit Platform</text>
    <!-- Description -->
    <text x="16" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#94a3b8">Leading product execution at</text>
    <text x="16" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#cbd5e1">Regesit</text>
    <text x="64" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#94a3b8">, an offline-first event</text>
    <text x="16" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#94a3b8">management &amp; fast check-in</text>
    <text x="16" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#94a3b8">operational system.</text>
  </g>

  <!-- Column 2: Software & AI -->
  <g transform="translate(313, 20)">
    <rect width="273" height="180" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="url(#card-border-2)" stroke-width="1.5"/>
    <!-- Category Pill -->
    <rect x="16" y="16" width="115" height="22" rx="6" fill="#1e293b"/>
    <text x="73.5" y="31" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#818cf8" letter-spacing="1">SOFTWARE &amp; AI</text>
    <!-- Title -->
    <text x="16" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#f8fafc">Agentic Systems</text>
    <!-- Description -->
    <text x="16" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#94a3b8">Building automated workflows,</text>
    <text x="16" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#94a3b8">agentic AI architectures, modern</text>
    <text x="16" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#94a3b8">full-stack web apps, and</text>
    <text x="16" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#94a3b8">intelligent backends.</text>
  </g>

  <!-- Column 3: Custom Solutions -->
  <g transform="translate(606, 20)">
    <rect width="274" height="180" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="url(#card-border-3)" stroke-width="1.5"/>
    <!-- Category Pill -->
    <rect x="16" y="16" width="135" height="22" rx="6" fill="#1e293b"/>
    <text x="83.5" y="31" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#c084fc" letter-spacing="1">CUSTOM SOLUTIONS</text>
    <!-- Title -->
    <text x="16" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#f8fafc">Hardware &amp; Audio</text>
    <!-- Description -->
    <text x="16" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#94a3b8">Developing custom software</text>
    <text x="16" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#94a3b8">and hardware for specialized</text>
    <text x="16" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#94a3b8">problems, including embedded</text>
    <text x="16" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#94a3b8">audio devices.</text>
  </g>
</svg>
