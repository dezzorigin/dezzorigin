<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="210" viewBox="0 0 900 210" fill="none">
  <!-- Container Background -->
  <rect width="100%" height="100%" fill="#0a0a0a" rx="12"/>
  <rect x="1" y="1" width="898" height="208" rx="11" fill="none" stroke="#262626" stroke-width="1"/>

  <!-- Column 1: Product & Systems -->
  <g transform="translate(20, 20)">
    <rect width="273" height="170" rx="8" fill="#141414" stroke="#262626" stroke-width="1"/>
    <!-- Badge -->
    <rect x="16" y="16" width="135" height="22" rx="4" fill="#262626"/>
    <text x="83.5" y="31" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#ffffff" letter-spacing="1">PRODUCT &amp; SYSTEMS</text>
    <!-- Title -->
    <text x="16" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Regesit Platform</text>
    <!-- Description -->
    <text x="16" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#a1a1aa">Leading product execution at</text>
    <text x="16" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">Regesit</text>
    <text x="64" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#a1a1aa">, an offline-first event</text>
    <text x="16" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#a1a1aa">management &amp; fast check-in</text>
    <text x="16" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#a1a1aa">operational system.</text>
  </g>

  <!-- Column 2: Software & AI -->
  <g transform="translate(313, 20)">
    <rect width="273" height="170" rx="8" fill="#141414" stroke="#262626" stroke-width="1"/>
    <!-- Badge -->
    <rect x="16" y="16" width="115" height="22" rx="4" fill="#262626"/>
    <text x="73.5" y="31" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#ffffff" letter-spacing="1">SOFTWARE &amp; AI</text>
    <!-- Title -->
    <text x="16" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Agentic Systems</text>
    <!-- Description -->
    <text x="16" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#a1a1aa">Building automated workflows,</text>
    <text x="16" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#a1a1aa">agentic AI architectures, modern</text>
    <text x="16" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#a1a1aa">full-stack web apps, and</text>
    <text x="16" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#a1a1aa">intelligent backends.</text>
  </g>

  <!-- Column 3: Custom Solutions -->
  <g transform="translate(606, 20)">
    <rect width="274" height="170" rx="8" fill="#141414" stroke="#262626" stroke-width="1"/>
    <!-- Badge -->
    <rect x="16" y="16" width="135" height="22" rx="4" fill="#262626"/>
    <text x="83.5" y="31" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#ffffff" letter-spacing="1">CUSTOM SOLUTIONS</text>
    <!-- Title -->
    <text x="16" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Hardware &amp; Audio</text>
    <!-- Description -->
    <text x="16" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#a1a1aa">Developing custom software</text>
    <text x="16" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#a1a1aa">and hardware for specialized</text>
    <text x="16" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#a1a1aa">problems, including embedded</text>
    <text x="16" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#a1a1aa">audio devices.</text>
  </g>
</svg>
