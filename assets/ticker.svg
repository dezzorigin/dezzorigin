<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="40" viewBox="0 0 900 40" fill="none">
  <style>
    .ticker-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 13px;
      font-weight: 700;
      fill: #38bdf8;
      letter-spacing: 1.5px;
    }
  </style>
  <rect width="100%" height="100%" fill="#0b0f19" rx="8"/>
  <rect x="1" y="1" width="898" height="38" rx="7" fill="none" stroke="#1e293b" stroke-width="1"/>
  <g>
    <text x="0" y="25" class="ticker-text" textLength="900">PRODUCT ENGINEER • SYSTEM ARCHITECTURE • FULL STACK &amp; AI • COMPUTER SCIENCE @ USK • </text>
    <text x="900" y="25" class="ticker-text" textLength="900">PRODUCT ENGINEER • SYSTEM ARCHITECTURE • FULL STACK &amp; AI • COMPUTER SCIENCE @ USK • </text>
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      from="0 0" 
      to="-900 0" 
      dur="14s" 
      repeatCount="indefinite" />
  </g>
</svg>
