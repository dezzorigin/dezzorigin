<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="150" viewBox="0 0 900 150" fill="none">
  <!-- Container -->
  <rect width="100%" height="100%" fill="#0a0a0a" rx="12"/>
  <rect x="1" y="1" width="898" height="148" rx="11" fill="none" stroke="#262626" stroke-width="1"/>

  <!-- Badge Header -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="80" height="22" rx="4" fill="#171717" stroke="#3f3f46" stroke-width="1"/>
    <text x="40" y="15" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" font-weight="700" fill="#ffffff" letter-spacing="1.5">ABOUT</text>
  </g>

  <!-- Content Paragraph -->
  <text x="30" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#e4e4e7">
    Product-minded software engineer dedicated to designing, building, and deploying end-to-end digital products.
  </text>
  <text x="30" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#a1a1aa">
