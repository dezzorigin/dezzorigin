    <rect x="310" y="0" width="150" height="20" rx="4" fill="#171717" stroke="#27272a" stroke-width="1"/>
    <text x="385" y="14" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#a1a1aa">EMBEDDED HARDWARE</text>
